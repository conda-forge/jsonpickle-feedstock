schema_version: 1

context:
  version: "4.1.4"

package:
  name: jsonpickle
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jsonpickle/jsonpickle-${{ version }}.tar.gz
  sha256: 8adf24cca611809b55ff5ed2ace850e1a3e4370dad5d363df71569b8f46c9645

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=61.2
    - setuptools_scm >=6.0
    - toml
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jsonpickle
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: >-
    Python library for serializing any arbitrary object graph into JSON.
    It can take almost any Python object and turn the object into JSON.
    Additionally, it can reconstitute the object back into Python.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: http://jsonpickle.github.io/
  repository: https://github.com/jsonpickle/jsonpickle

extra:
  recipe-maintainers:
    - robmcmullen
    - ChrisBarker-NOAA
    - synapticarbors
